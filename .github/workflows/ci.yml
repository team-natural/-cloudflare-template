name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@24
          cache: true
          require-lockfile: true

      - run: pnpm check

      # Vitest needs packages/schema/migrations to exist. A project commits it, and there
      # db:generate is a no-op ("No schema changes") that doubles as a drift check; the bare
      # template ships none (derived artifact — see CLAUDE.md), so this materialises it.
      - run: pnpm db:generate
      - run: pnpm test

      # One install covers both apps (browsers cache per machine). The login-flow suite skips
      # itself unless E2E_ADMIN_EMAIL / E2E_ADMIN_PASSWORD are set — add them as secrets, plus a
      # seed:admin step, to run it here too.
      - run: pnpm --filter admin exec playwright install --with-deps chromium
      - run: pnpm test:e2e

      - run: pnpm build
